spring.application.name=smart-gateway-service
server.port=8080

info.app.name=Smart Gateway Service
info.app.description=Custom API gateway for routing, security, and traffic management

management.api.username=${GATEKEEPER_GATEWAY_USERNAME:gateway-service}
management.api.password=${GATEKEEPER_GATEWAY_PASSWORD:gateway123}
management.api.base-url=${GATEKEEPER_MANAGEMENT_URL:http://localhost:8081}

gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
gateway.kafka.configuration-group=${GATEKEEPER_CONFIGURATION_GROUP:smart-gateway-configuration}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer